<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropGuard - Plant Health Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: url('leaf_project.jpeg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(46, 139, 87, 0.9);
            padding: 15px 30px;
            color: white;
        }
        .app-name {
            font-size: 24px;
            font-weight: 600;
        }
        .nav-links {
            list-style: none;
            display: flex;
        }
        .nav-links li {
            margin: 0 15px;
        }
        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }
        .nav-links a:hover {
            color: #c3e6cb;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            text-align: center;
            color: white;
        }
        .welcome-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        .welcome-box h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .welcome-box p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .cta-btn {
            background: #2E8B57;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .cta-btn:hover {
            background: #1C6B44;
        }
        .hidden {
            display: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="app-name">CropGuard</div>
        <ul class="nav-links">
            <li><a href="home2.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signUp.html">Signup</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="welcome-box">
            <h1>Welcome to CropGuard</h1>
            <p>Protect your plants with AI-powered disease detection.</p>
            <button class="cta-btn" onclick="location.href='detection.html'">Scan a Leaf</button>
        </div>
    </div>
</body>
</html>
